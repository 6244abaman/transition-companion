<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media=\'all\'">
<style>
:root{--bg:#F3ECE0;--paper:#FFFDF8;--ink:#17201B;--ink2:#46524B;--ink3:#7C857F;--line:#E6DDCC;--green:#2F5A46;--deep:#1B3529;--mint:#E3F0E8;--sun:#FF7A4D;--gold:#F2B33D;--serif:"Frank Ruhl Libre",Georgia,serif;--sans:Heebo,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 50% -10%,#FBF5EA 0,var(--bg) 60%) fixed}
button{font:inherit;cursor:pointer;color:inherit}a{color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(243,236,224,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px)}
.top h1{flex:1;margin:0;font-size:15px;font-weight:700;text-align:center;color:var(--ink2);letter-spacing:.2px}
.ib{min-width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;text-decoration:none;font-weight:800;color:var(--deep);padding:0 10px}
main{max-width:620px;margin:0 auto;padding:6px 16px 120px}
.fade{animation:in .38s cubic-bezier(.2,.7,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.4px;color:var(--green);text-transform:uppercase}
.eyebrow:before{content:"";width:18px;height:2px;border-radius:2px;background:var(--sun)}
.display{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.08;margin:10px 0 10px;letter-spacing:-.3px}
.display em{font-style:normal;color:var(--green);background:linear-gradient(transparent 62%,#FFD9A8 62%,#FFD9A8 92%,transparent 92%)}
.lead{font-size:16.5px;line-height:1.6;color:var(--ink2);margin:0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 8px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 10px}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--deep);color:#fff;font-size:13px;margin-bottom:6px}
.step span{font-size:13px;line-height:1.35;color:var(--ink2);font-weight:600;display:block}
.sec{margin-top:26px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{margin:0;font-size:18px;font-weight:800}.sec-h small{color:var(--ink3);font-size:13px}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{position:relative;text-align:start;display:flex;flex-direction:column;gap:6px;padding:14px 12px 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--paper);min-height:128px;transition:transform .15s,border-color .15s,box-shadow .15s}
.svc button:active{transform:scale(.98)}
.svc button b{font-size:15px;line-height:1.25}.svc button small{font-size:12.5px;color:var(--ink3);line-height:1.35}
.svc button.on{border-color:var(--green);background:linear-gradient(160deg,#F2F9F4,#E3F0E8);box-shadow:0 8px 22px rgba(47,90,70,.16)}
.svc button.on:after{content:"✓";position:absolute;top:10px;inset-inline-end:10px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}
.svc .wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center}
.ill{display:inline-block;line-height:0}.ill svg{width:44px;height:44px}
.seg{display:inline-flex;background:#E9E1D2;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 22px;border-radius:11px;font-weight:800;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--deep);box-shadow:0 2px 8px rgba(23,32,27,.12)}
.dock{position:fixed;inset-inline:0;bottom:0;z-index:15;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.dock-in{max-width:620px;margin:0 auto;display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;min-height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);font-weight:800;color:var(--deep);text-decoration:none;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.primary{background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 10px 24px rgba(27,53,41,.28)}
.btn.grow{flex:1}.btn.ghost{border:0;background:none;min-height:auto;padding:8px;text-decoration:underline;color:var(--ink2);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.muted{color:var(--ink3);font-size:14px;line-height:1.55}
.resume{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--deep);color:#fff;margin-top:18px}
.resume b{display:block}.resume small{color:#CFE2D6}.resume .btn{margin-inline-start:auto;min-height:44px;padding:10px 14px;background:#fff;color:var(--deep);border:0}
/* question */
.track{display:flex;gap:4px;margin:8px 0 14px}.track i{flex:1;height:5px;border-radius:5px;background:#E2D9C8;transition:background .25s}
.track i.done{background:#8DBBA2}.track i.cur{background:var(--deep)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:800}
.g0{background:#FDE6DC;color:#9C3B18}.g1{background:#E9E5FD;color:#4636A0}.g2{background:#DDF0FA;color:#17668E}.g3{background:#FBEFC6;color:#735400}.g4{background:#E1F1E8;color:#1C5A3B}.g5{background:#F8E0E9;color:#932C54}
.count{font-size:13px;font-weight:800;color:var(--ink3)}
.skill{font-family:var(--serif);font-weight:900;font-size:36px;line-height:1.1;margin:14px 0 8px;letter-spacing:-.3px}
.sdesc{font-size:17px;line-height:1.55;color:var(--ink2);margin:0}
.quote{margin:16px 0 0;padding:12px 14px;border-inline-start:3px solid var(--sun);background:rgba(255,255,255,.55);border-radius:4px 14px 14px 4px}
.quote small{display:block;font-size:12px;font-weight:800;color:var(--ink3);margin-bottom:2px;letter-spacing:.3px}.quote p{margin:0;line-height:1.5}
.rate{margin-top:24px;padding:18px 14px 14px;border-radius:24px;background:var(--paper);border:1px solid var(--line);box-shadow:0 6px 20px rgba(23,32,27,.05)}
.rate h4{margin:0 0 14px;font-size:15.5px;font-weight:800}
.dial{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 2px}
.dial:before,.dial .fill{content:"";position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:6px;inset-inline-start:22px}
.dial:before{inset-inline-end:22px;background:#E8E0D0}
.dial .fill{background:linear-gradient(90deg,#8DBBA2,var(--green));transition:width .3s cubic-bezier(.2,.7,.2,1)}
[dir=rtl] .dial .fill{background:linear-gradient(270deg,#8DBBA2,var(--green))}
.dial button{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;border:2px solid #DCD3C1;background:var(--paper);font-weight:900;font-size:15px;color:var(--ink2);transition:all .2s cubic-bezier(.2,.7,.2,1)}
.dial button.past{border-color:#8DBBA2;background:#EEF6F1;color:var(--green)}
.dial button.on{width:50px;height:50px;font-size:19px;background:var(--deep);border-color:var(--deep);color:#fff;box-shadow:0 0 0 6px rgba(47,90,70,.14),0 8px 18px rgba(27,53,41,.3)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);margin-top:8px;font-weight:600}
.verdict{margin:14px 0 0;min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;border-radius:14px;background:#F6F1E7;font-weight:800;color:var(--deep);font-size:15px}
.verdict.empty{color:var(--ink3);font-weight:600}
.skip{display:block;margin:10px auto 0;border:0;background:none;color:var(--ink3);font-weight:700;text-decoration:underline;font-size:14px}.skip.on{color:var(--green)}
.note{margin-top:14px;border-radius:24px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.note summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;font-weight:800}.note summary::-webkit-details-marker{display:none}
.note summary .plus{width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:900}
.note summary small{display:block;font-weight:500;color:var(--ink3);font-size:13px}
.note .in{padding:0 14px 14px}
textarea{width:100%;min-height:92px;padding:12px;border:1.5px solid #D9CFBC;border-radius:14px;font:inherit;font-size:16px;line-height:1.5;background:#fff;color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #DCEBE2}
.confirm{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink2)}.confirm input{width:22px;height:22px;accent-color:var(--green);flex:0 0 auto}
.cvx{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--mint);font-size:14.5px;line-height:1.5;color:#1C4A35}.cvx small{display:block;font-weight:800;font-size:12px;margin-bottom:2px;color:#2F6B4D}
/* results */
.rhero{position:relative;overflow:hidden;border-radius:28px;padding:22px 18px;background:linear-gradient(155deg,#1B3529 0,#2F5A46 70%,#3E7058 100%);color:#fff;box-shadow:0 18px 40px rgba(27,53,41,.3)}
.rhero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(#FFC36B 0,rgba(255,195,107,0) 70%);top:-90px;inset-inline-end:-70px;opacity:.55}
.rhero .eyebrow{color:#CFE7D8}.rhero .display{color:#fff;font-size:30px}
.podium{position:relative;z-index:1;display:grid;gap:8px;margin-top:14px}
.pod{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.pod .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:18px;background:#FFC36B;color:#4A2A00}
.pod:nth-child(2) .n{background:#E8E2D6;color:#3A3A3A}.pod:nth-child(3) .n{background:#F0B48A;color:#4A2300}
.pod b{display:block;font-size:16.5px}.pod small{color:#CFE2D6;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:900;color:var(--deep);line-height:1.1}.stat small{color:var(--ink3);font-size:12.5px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:16px;margin-top:12px}
.area{display:grid;grid-template-columns:118px 1fr 30px;gap:10px;align-items:center;font-size:14px;font-weight:700;margin-top:10px}
.area .bar{height:10px;border-radius:10px;background:#EEE7DA;overflow:hidden}.area .bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#8DBBA2,var(--green))}
[dir=rtl] .area .bar i{background:linear-gradient(270deg,#8DBBA2,var(--green))}.area em{font-style:normal;color:var(--ink3);text-align:end;font-size:13px}
.sk{padding:14px 0;border-top:1px solid #EFE8DB}.sk:first-of-type{border-top:0}
.sk-h{display:flex;align-items:center;justify-content:space-between;gap:10px}.sk-h b{font-size:16px}
.meter{display:flex;gap:3px}.meter i{width:12px;height:6px;border-radius:3px;background:#E6DECF}.meter i.on{background:var(--green)}
.sk p{margin:8px 0 0;line-height:1.5;font-size:14.5px}.line{padding:9px 11px;border-radius:12px;background:var(--mint);color:#1C4A35}
.tag{display:inline-block;margin-top:6px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:800}.tag.ok{background:var(--mint);color:#1C5A3B}.tag.need{background:#FBEFC6;color:#735400}
.mini{min-height:40px;padding:8px 12px;border-radius:12px;font-size:14px;margin-top:8px}
.next{display:grid;gap:10px;margin-top:12px}
.next a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--paper);border:1.5px solid var(--line);text-decoration:none}
.next a.hot{border-color:var(--green);background:linear-gradient(160deg,#F2F9F4,#E3F0E8)}
.next a b{display:block;font-size:16px}.next a small{color:var(--ink3);font-size:13px;line-height:1.4}.next a .go{margin-inline-start:auto;font-weight:900;color:var(--green);font-size:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--deep);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;z-index:30}.toast.on{opacity:1;transform:translate(-50%,0)}
details.how{margin-top:18px}details.how summary{cursor:pointer;font-weight:700;color:var(--ink2)}
@media (min-width:560px){.svc{grid-template-columns:1fr 1fr 1fr}.display{font-size:40px}.skill{font-size:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html[data-theme="dark"]{--bg:#121814;--paper:#1A221D;--ink:#E8EFE9;--ink2:#C3CEC6;--ink3:#8F9C93;--line:#2B362F;--mint:#20372A;--deep:#9CC7AE}
html[data-theme="dark"] body{background:var(--bg)}html[data-theme="dark"] .top{background:rgba(18,24,20,.86)}
html[data-theme="dark"] .btn.primary{color:#10201A}html[data-theme="dark"] textarea{background:#1F2923;color:var(--ink)}
html[data-theme="dark"] .verdict,html[data-theme="dark"] .quote{background:#1F2923}html[data-theme="dark"] .rhero{background:linear-gradient(155deg,#16291F,#24473A)}
</style>
</head>

<header class="top"><a class="ib" id="back" href="./index.html" aria-label="Back">→</a><h1 id="title">Strengths from your service</h1><button class="ib lang" id="language" type="button">EN</button></header>
<main id="app" aria-live="polite"></main>

<script>
const KEY='momentum-business-skills-v1';
const DATA={"groups":[{"en":"Mission & Execution","he":"ביצוע ומשימות"},{"en":"Leadership & People","he":"מנהיגות ואנשים"},{"en":"Resilience & Mindset","he":"חוסן והתמודדות"},{"en":"Thinking & Problem Solving","he":"חשיבה ופתרון בעיות"},{"en":"Character & Values","he":"ערכים ואחריות"},{"en":"Communication & Creativity","he":"תקשורת ויצירתיות"}],"items":[{"id":1,"group":0,"en":"Finishing the Job","he":"התמדה עד השלמת המשימה","desc":"Complete assigned responsibilities despite obstacles.","soldier":"Completed an assigned duty despite obstacles.","commander":"Ensured the team finished its assignment.","heDesc":"לסיים את מה שהתחלת גם כשיש מכשולים בדרך.","heSoldier":"השלמת משימה שהוטלה עליך למרות קשיים.","heCommander":"דאגת שהצוות יסיים את המשימה עד הסוף.","cvEn":"Completed a 3-week logistics project on time despite missing equipment.","cvHe":"השלמת פרויקט לוגיסטי של 3 שבועות בזמן, למרות חוסר בציוד."},{"id":2,"group":0,"en":"Working Under Pressure","he":"תפקוד תחת לחץ","desc":"Perform effectively under time pressure.","soldier":"Carried out duties in a stressful exercise.","commander":"Coordinated people during an urgent situation.","heDesc":"לתפקד טוב כשיש לחץ של זמן או מצב.","heSoldier":"ביצעת את התפקיד שלך בתרגיל לחוץ.","heCommander":"תיאמת אנשים במצב דחוף.","cvEn":"Kept a 12-person shift running during a 48-hour emergency.","cvHe":"הפעלת משמרת של 12 אנשים לאורך 48 שעות חירום."},{"id":3,"group":0,"en":"Planning","he":"תכנון","desc":"Plan steps, resources and schedules.","soldier":"Prepared equipment and tasks.","commander":"Prepared an activity plan and the team.","heDesc":"לתכנן צעדים, ציוד ולוחות זמנים מראש.","heSoldier":"הכנת ציוד ומשימות לפני פעילות.","heCommander":"הכנת תוכנית פעילות והכנת את הצוות.","cvEn":"Planned weekly schedules and equipment for a 20-person team.","cvHe":"תכנון לוחות זמנים וציוד שבועיים לצוות של 20 אנשים."},{"id":4,"group":0,"en":"Time Management","he":"ניהול זמן","desc":"Manage several duties and deadlines.","soldier":"Met deadlines across assignments.","commander":"Coordinated several schedules.","heDesc":"לנהל כמה משימות ומועדים במקביל.","heSoldier":"עמדת בזמנים בכמה משימות שונות.","heCommander":"תיאמת כמה לוחות זמנים במקביל.","cvEn":"Managed 4 parallel tasks and met every deadline.","cvHe":"ניהול 4 משימות במקביל ועמידה בכל המועדים."},{"id":5,"group":0,"en":"Improvisation","he":"אלתור","desc":"Find a practical alternative when plans fail.","soldier":"Found an alternative when equipment was missing.","commander":"Changed a team approach when conditions changed.","heDesc":"למצוא פתרון מעשי כשהתוכנית לא עובדת.","heSoldier":"מצאת חלופה כשחסר ציוד.","heCommander":"שינית את דרך העבודה של הצוות כשהתנאים השתנו.","cvEn":"Found a working alternative within an hour when a key system failed.","cvHe":"מציאת פתרון חלופי תוך שעה כשמערכת מרכזית קרסה."},{"id":6,"group":0,"en":"Technological Know-How","he":"יכולת טכנולוגית","desc":"Learn and use tools or digital systems.","soldier":"Learned to operate an unfamiliar system.","commander":"Helped others learn a system.","heDesc":"ללמוד ולהפעיל כלים ומערכות דיגיטליות.","heSoldier":"למדת להפעיל מערכת שלא הכרת.","heCommander":"עזרת לאחרים ללמוד מערכת.","cvEn":"Learned a new tracking system in a week and trained 5 colleagues on it.","cvHe":"לימוד מערכת מעקב חדשה תוך שבוע והדרכת 5 עמיתים."},{"id":7,"group":0,"en":"Prioritization","he":"קביעת סדרי עדיפויות","desc":"Identify the most important task first.","soldier":"Identified an urgent task during a busy shift.","commander":"Allocated resources to highest priorities.","heDesc":"לזהות מה הכי חשוב ולעשות אותו קודם.","heSoldier":"זיהית משימה דחופה במשמרת עמוסה.","heCommander":"הקצית אנשים ומשאבים לפי סדר חשיבות.","cvEn":"Prioritised urgent requests during busy shifts so nothing critical was missed.","cvHe":"קביעת סדרי עדיפויות במשמרות עמוסות כך ששום דבר דחוף לא פוספס."},{"id":8,"group":0,"en":"Calculated Risk-Taking","he":"נטילת סיכונים מחושבת","desc":"Evaluate possible risks before acting.","soldier":"Chose a safe course after recognizing a risk.","commander":"Weighed options before authorizing an action.","heDesc":"לבדוק סיכונים לפני שפועלים.","heSoldier":"בחרת דרך בטוחה אחרי שזיהית סיכון.","heCommander":"שקלת אפשרויות לפני שאישרת פעולה.","cvEn":"Assessed safety risks before each activity and adjusted plans accordingly.","cvHe":"הערכת סיכוני בטיחות לפני כל פעילות והתאמת התוכנית בהתאם."},{"id":9,"group":0,"en":"Leading Processes","he":"הובלת תהליכים","desc":"Coordinate multiple steps to achieve a result.","soldier":"Managed a sequence of assigned activities.","commander":"Coordinated a multi-stage team activity.","heDesc":"לתאם כמה שלבים כדי להגיע לתוצאה.","heSoldier":"ניהלת רצף של פעולות שהוטלו עליך.","heCommander":"תיאמת פעילות צוות בכמה שלבים.","cvEn":"Coordinated a multi-stage process across 3 teams from start to finish.","cvHe":"תיאום תהליך רב-שלבי בין 3 צוותים מתחילתו ועד סופו."},{"id":10,"group":0,"en":"Operating Independently","he":"עבודה עצמאית","desc":"Work responsibly without constant supervision.","soldier":"Completed an assignment without repeated instructions.","commander":"Managed a responsibility with limited guidance.","heDesc":"לעבוד באחריות בלי השגחה צמודה.","heSoldier":"השלמת משימה בלי שהיו צריכים להזכיר לך.","heCommander":"ניהלת תחום אחריות עם מעט הנחיות.","cvEn":"Ran a remote post independently with minimal supervision for 6 months.","cvHe":"הפעלה עצמאית של עמדה מרוחקת במשך 6 חודשים עם מעט פיקוח."},{"id":11,"group":1,"en":"Leadership","he":"מנהיגות","desc":"Influence others through initiative and example.","soldier":"Helped teammates succeed without a formal title.","commander":"Guided a team toward a shared result.","heDesc":"להשפיע על אחרים ביוזמה ובדוגמה אישית.","heSoldier":"עזרת לחברים להצליח גם בלי תפקיד רשמי.","heCommander":"הובלת צוות לתוצאה משותפת.","cvEn":"Led a team of 8 to complete a demanding project with no safety incidents.","cvHe":"הובלת צוות של 8 אנשים להשלמת פרויקט תובעני ללא אירועי בטיחות."},{"id":12,"group":1,"en":"Teamwork","he":"עבודת צוות","desc":"Cooperate toward a shared objective.","soldier":"Supported teammates during a difficult task.","commander":"Built teamwork among members.","heDesc":"לשתף פעולה עם אחרים למטרה משותפת.","heSoldier":"תמכת בחברים בזמן משימה קשה.","heCommander":"בנית גיבוש ושיתוף פעולה בצוות.","cvEn":"Worked closely with a 10-person team to meet shared weekly goals.","cvHe":"עבודה צמודה בצוות של 10 אנשים לעמידה ביעדים שבועיים משותפים."},{"id":13,"group":1,"en":"Leading People","he":"הובלת אנשים","desc":"Help individuals improve and succeed.","soldier":"Helped a less experienced teammate.","commander":"Coached an individual to improve.","heDesc":"לעזור לאנשים להשתפר ולהצליח.","heSoldier":"עזרת לחבר עם פחות ניסיון.","heCommander":"ליווית אדם אחד עד שהשתפר.","cvEn":"Mentored 3 new team members until they worked independently.","cvHe":"חניכת 3 אנשי צוות חדשים עד לעבודה עצמאית."},{"id":14,"group":1,"en":"Teaching Skills","he":"הדרכת מיומנויות","desc":"Show others how to complete a task.","soldier":"Showed a new soldier how to use equipment.","commander":"Planned and conducted team training.","heDesc":"להראות לאחרים איך עושים משהו.","heSoldier":"הראית לחייל חדש איך להפעיל ציוד.","heCommander":"תכננת והעברת הדרכה לצוות.","cvEn":"Planned and delivered training sessions to groups of 15.","cvHe":"תכנון והעברת הדרכות לקבוצות של 15 משתתפים."},{"id":15,"group":1,"en":"Working with Different People","he":"עבודה עם אנשים שונים","desc":"Work effectively with different personalities and backgrounds.","soldier":"Cooperated with unfamiliar teammates.","commander":"Managed different strengths and personalities.","heDesc":"לעבוד טוב עם אנשים שונים ממך.","heSoldier":"עבדת עם אנשים שלא הכרת.","heCommander":"ניהלת צוות עם אופי וחוזקות שונים.","cvEn":"Worked effectively in diverse teams with people from varied backgrounds.","cvHe":"עבודה אפקטיבית בצוותים מגוונים עם אנשים מרקעים שונים."},{"id":16,"group":1,"en":"Service Orientation","he":"תודעת שירות","desc":"Understand what someone needs and help them.","sold גנת מחדש את המשימות אחרי שינוי.","cvEn":"Moved into a new role and was fully effective within a month.","cvHe":"מעבר לתפקיד חדש ותפקוד מלא בתוך חודש."},{"id":29,"group":3,"en":"Thinking Big","he":"חשיבה רחבה","desc":"Develop goals beyond the immediate task.","soldier":"Proposed improvement beyond your task.","commander":"Led a broader improvement initiative.","heDesc":"לחשוב על מטרות רחבות יותר מהמשימה של עכשיו.","heSoldier":"הצעת שיפור מעבר למה שהתבקשת.","heCommander":"הובלת יוזמת שיפור רחבה.","cvEn":"Initiated an improvement that went beyond my own task.","cvHe":"יזימת שיפור שחרג מתחום המשימה שלי."},{"id":30,"group":3,"en":"Flexibility","he":"גמישות","desc":"Change methods while retaining the objective.","soldier":"Changed the method while meeting the objective.","commander":"Adjusted team plans while preserving objectives.","heDesc":"לשנות את הדרך ולשמור על המטרה.","heSoldier":"שינית שיטה ועדיין עמדת ביעד.","heCommander":"התאמת תוכניות צוות בלי לוותר על המטרה.","cvEn":"Changed working methods while still hitting every target.","cvHe":"שינוי שיטות עבודה תוך עמידה בכל היעדים."},{"id":31,"group":4,"en":"Trustworthiness","he":"אמינות","desc":"Keep commitments and act reliably.","soldier":"Could be relied upon for important work.","commander":"Was trusted with people and resources.","heDesc":"לעמוד בהתחייבויות ולהיות מישהו שסומכים עליו.","heSoldier":"סמכו עליך במשימות חשובות.","heCommander":"הפקידו בידיך אנשים ומשאבים.","cvEn":"Was trusted with sensitive equipment and responsibility for people.","cvHe":"אחריות על ציוד רגיש ועל אנשים."},{"id":32,"group":4,"en":"Work Ethic / Integrity","he":"מוסר עבודה ויושרה","desc":"Work consistently and do the right thing.","soldier":"Maintained standards when nobody checked.","commander":"Modeled ethical conduct.","heDesc":"לעבוד בהתמדה ולעשות את הדבר הנכון.","heSoldier":"שמרת על רמה גם כשאף אחד לא בדק.","heCommander":"היית דוגמה להתנהגות ישרה.","cvEn":"Kept high standards consistently, even without oversight.","cvHe":"שמירה על רמה
