name: Next Generation foundation
on:
  pull_request:
  push:
    branches: [development/next-generation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: next-generation/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: next-generation
      - run: npm test
        working-directory: next-generation
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check startup, reuse, static boundaries and shutdown
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Startup failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/start.ps1 -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Reuse failed' }
          $health = Invoke-RestMethod http://127.0.0.1:43128/healthz
          if ($health.service -ne 'momentum-next-generation') { throw 'Wrong app' }
          foreach ($path in '/', '/app.mjs', '/vault.mjs', '/shared/memory.mjs', '/fonts/heebo.ttf') {
            $r = Invoke-WebRequest ("http://127.0.0.1:43128" + $path) -UseBasicParsing
            if ($r.StatusCode -ne 200) { throw "Asset failed: $path" }
          }
          try { Invoke-WebRequest http://127.0.0.1:43128/.env -UseBasicParsing; throw 'Secret path exposed' }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/stop.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Shutdown failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/stop.ps1
      - name: Check staff desk setup, persistence, isolation and stop
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/start.ps1 -KnowledgeDesk -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge desk startup failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/start.ps1 -KnowledgeDesk -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge desk reuse failed' }
          $preview = Invoke-RestMethod http://127.0.0.1:43129/staff/preview
          if ($preview.items.Count -ne 4 -or $preview.status -ne 'pending-professional-review') { throw 'Seed set must remain draft' }
          $public = Invoke-RestMethod 'http://127.0.0.1:43129/knowledge?domain=benefits&language=he'
          if ($public.items.Count -ne 0) { throw 'Unreviewed facts were published' }
          try { Invoke-WebRequest http://127.0.0.1:43129/.local/knowledge.snapshot -UseBasicParsing; throw 'Snapshot exposed' }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw } }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/stop.ps1 -KnowledgeDesk
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge desk stop failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/start.ps1 -KnowledgeDesk -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge desk restart failed' }
          $preview = Invoke-RestMethod http://127.0.0.1:43129/staff/preview
          if ($preview.items.Count -ne 4) { throw 'Seed preview changed after restart' }
          node --test next-generation/tests/durability.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Cross-process durability failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./next-generation/windows/stop.ps1 -KnowledgeDesk
          if ($LASTEXITCODE -ne 0) { throw 'Knowledge desk final stop failed' }
