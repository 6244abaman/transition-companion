<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21695f">
<title>Transition Companion Next</title>
<body>
<p id="s" style="font:16px system-ui;padding:24px;color:#173c37">Loading Transition Companion Next…</p>
<script>
(async()=>{
  try{
    const parts=await Promise.all(Array.from({length:10},(_,i)=>
      fetch(`./.bundle/c${i+1}.txt`,{cache:'no-store'})
        .then(r=>{if(!r.ok)throw new Error(`part ${i+1}`);return r.text()})
    ));
    const bin=atob(parts.join('').trim());
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const html=new TextDecoder().decode(bytes);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('s').textContent='Could not load Transition Companion Next. '+e.message;
  }
})();
</script>
</body>
